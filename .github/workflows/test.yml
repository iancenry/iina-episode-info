name: Test

# The parser suite runs on every push and pull request. It used to run nowhere:
# the only workflow was the daily API health check, so a broken parser or a
# broken episode lookup merged green.
on:
  push:
    branches: [main]
    paths:
      - "main.js"
      - "sidebar.html"
      - "overlay.html"
      - "tests/**"
      - "scripts/**"
      - "Info.json"
      - "package.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "main.js"
      - "sidebar.html"
      - "overlay.html"
      - "tests/**"
      - "scripts/**"
      - "Info.json"
      - "package.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Parser and identification suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Pinned because the suite asserts on Node's test runner and the vm
          # realm behaviour; a new major could change either.
          node-version: "24"

      - name: Run the suite
        run: npm test

      - name: Verify the plugin manifest still matches the shipped version
        run: node -e '
          const a = require("./Info.json").version;
          const b = require("./package.json").version;
          // The header comment in main.js claims CI keeps this in step, so it is
          // compared rather than left as a claim nobody checks.
          const fs = require("fs");
          const m = /\@version\s+([0-9]+\.[0-9]+\.[0-9]+)/.exec(fs.readFileSync("main.js", "utf8"));
          const c = m && m[1];
          const bad = [];
          if (a !== b) bad.push(`Info.json ${a} vs package.json ${b}`);
          if (a !== c) bad.push(`Info.json ${a} vs main.js ${c || "none"}`);
          if (bad.length) { console.error("version mismatch: " + bad.join("; ")); process.exit(1); }
          console.log("version " + a + " everywhere");
        '
