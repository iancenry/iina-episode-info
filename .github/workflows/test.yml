name: Test

# The parser suite runs on every push and pull request. It used to run nowhere:
# the only workflow was the daily API health check, so a broken parser or a
# broken episode lookup merged green.
on:
  push:
    branches: [main]
    paths:
      - "main.js"
      - "sidebar.html"
      - "overlay.html"
      - "tests/**"
      - "scripts/**"
      - "Info.json"
      - "package.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "main.js"
      - "sidebar.html"
      - "overlay.html"
      - "tests/**"
      - "scripts/**"
      - "Info.json"
      - "package.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Parser and identification suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Pinned because the suite asserts on Node's test runner and the vm
          # realm behaviour; a new major could change either.
          node-version: "24"

      - name: Run the suite
        run: npm test

      - name: Verify the plugin manifest still matches the shipped version
        # A script file, not inline `node -e`. A JavaScript string containing
        # ": " ends a YAML plain scalar, so the workflow did not parse at all:
        # GitHub reported a syntax error and ran no steps, which looks exactly
        # like a broken suite. Nothing this fragile belongs in a YAML value.
        run: node scripts/check-version.mjs
